# devops-incidents 场景套件 —— S4：单 goto；★ 503 错误分支的断言也在这一个页面内完成。
#
# 字段集来源纪律（Task 4 同款）：35 个 field 字面量逐字取自 .nx-mk/manifest.json 的
# 35 条唯一 normalizedPath（详见 verify-manifest.mjs 的 REQUIRED 列表）。
# **不抄 brief**：brief 的列表在 200/503 同 path 多状态码上有外观派生的混淆实现。
#
# S4：整页导航会重置 collector 缓冲，故整条套件只能 goto 一次 —— 单页自驱动渲染
# 全部视图（ServiceList / IncidentList 列表区+201 回显区 / HealthChecker 200+503）。
# S2：DSL 只有 goto / waitFor / waitForRequest / assertFieldVisible / screenshot 五种
# step（packages/scenario/src/dsl-schema.ts），无 click/fill —— 一切依赖页面自驱动。
#
# S3（套件是子集）：assertFieldVisible 只要有一个 [data-mk-field="X"] 可见即过。
# 真正的门是 verify-coverage.mjs 的断言 B/C/D/E（以 coverage-report.json 为准），
# G 不能替代之 —— 本套件取「与分母逐字相等」的更强口径（35/35）。
#
# 数据流前提（G6）：MK_ANALYSIS=true 启的 vite 进程才有 collector 投递口，
# 否则 app 走 production 分支、请求不进 trace 通道，request_traces 表会空。
version: 1
scenarios:
  - id: devops-incidents-full
    name: 服务列表 + 事件列表 + 健康检查（200/503 双分支）+ 备注回显 全字段覆盖
    route: /
    steps:
      - id: goto-app
        type: goto
        url: http://localhost:5203/

      # ─── 四个视图 + 503 错误卡都渲染完，才进入断言 ───
      # health-error dl 是 C2 绕行最关键的就绪信号 —— 它的 4 个字段必须等到原生 fetch 的
      # res.json() 拿到之后才渲染。漏掉这个等待点 → 那 4 条路径判 NO EVIDENCE。
      - id: wait-services
        type: waitFor
        selector: "[data-page='service-list']"
      - id: wait-incidents
        type: waitFor
        selector: "[data-page='incident-list']"
      - id: wait-health-ok
        type: waitFor
        selector: "[data-testid='health-ok']"
      - id: wait-health-error
        type: waitFor
        selector: "[data-testid='health-error'] dl"
      - id: wait-incident-note
        type: waitFor
        selector: "[data-testid='incident-note']"

      # ─── 服务数组元素（7）───
      - id: assert-svc-id
        type: assertFieldVisible
        field: data[].id
      - id: assert-svc-name
        type: assertFieldVisible
        field: data[].name
      - id: assert-svc-status
        type: assertFieldVisible
        field: data[].status
      - id: assert-svc-region
        type: assertFieldVisible
        field: data[].region
      - id: assert-svc-version
        type: assertFieldVisible
        field: data[].version
      - id: assert-svc-deps
        type: assertFieldVisible
        field: data[].dependencies[]
      - id: assert-svc-deployed
        type: assertFieldVisible
        field: data[].lastDeployedAt

      # ─── 事件数组元素（13：6 标量 + 4 assignee + 3 impact）───
      - id: assert-inc-id
        type: assertFieldVisible
        field: data[].id
      - id: assert-inc-title
        type: assertFieldVisible
        field: data[].title
      - id: assert-inc-severity
        type: assertFieldVisible
        field: data[].severity
      - id: assert-inc-state
        type: assertFieldVisible
        field: data[].state
      - id: assert-inc-opened
        type: assertFieldVisible
        field: data[].openedAt
      - id: assert-inc-resolved
        type: assertFieldVisible
        field: data[].resolvedAt
      - id: assert-assignee
        type: assertFieldVisible
        field: data[].assignee
      - id: assert-assignee-id
        type: assertFieldVisible
        field: data[].assignee.id
      - id: assert-assignee-name
        type: assertFieldVisible
        field: data[].assignee.name
      - id: assert-assignee-email
        type: assertFieldVisible
        field: data[].assignee.email
      - id: assert-impact
        type: assertFieldVisible
        field: data[].impact
      - id: assert-impact-users
        type: assertFieldVisible
        field: data[].impact.usersAffected
      - id: assert-impact-regions
        type: assertFieldVisible
        field: data[].impact.regions[]

      # ─── 健康检查 200 分支（5）───
      - id: assert-health-status
        type: assertFieldVisible
        field: data.status
      - id: assert-check-name
        type: assertFieldVisible
        field: data.checks[].name
      - id: assert-check-passed
        type: assertFieldVisible
        field: data.checks[].passed
      - id: assert-check-latency
        type: assertFieldVisible
        field: data.checks[].latencyMs
      - id: assert-check-message
        type: assertFieldVisible
        field: data.checks[].message

      # ─── 健康检查 503 分支（4）：C2 绕行 ───
      - id: assert-err-code
        type: assertFieldVisible
        field: data.code
      - id: assert-err-message
        type: assertFieldVisible
        field: data.message
      - id: assert-err-retry
        type: assertFieldVisible
        field: data.retryAfterSeconds
      - id: assert-err-contact
        type: assertFieldVisible
        field: data.contact

      # ─── 备注回显（3）：POST 201 —— 含 IncidentNote.id（与 data[].id 是不同 normalizedPath）───
      - id: assert-note-id
        type: assertFieldVisible
        field: data.id
      - id: assert-note-body
        type: assertFieldVisible
        field: data.body
      - id: assert-note-created
        type: assertFieldVisible
        field: data.createdAt

      - id: shot
        type: screenshot